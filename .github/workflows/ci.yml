name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Test
        run: npm test
      - name: core/ must not import view, app or io
        run: |
          if grep -rn 'from "@/\(view\|app\|io\)' src/core/; then
            echo "::error::core/ imports from a layer above it"
            exit 1
          fi
