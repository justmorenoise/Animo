name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs with write access, which is safe only because
      # no step checks out or runs the PR's code. Keep it that way.
      - if: github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' || github.event_name == 'pull_request_target'
        # v2.6.1, pinned by SHA
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/justmorenoise/animo/blob/main/CLA.md
          # Signatures are commits: a branch of their own keeps them out of main's history.
          branch: cla-signatures
          allowlist: justmorenoise,dependabot[bot]
          create-file-commit-message: Create the CLA signatures file
          signed-commit-message: "$contributorName signed the CLA in #$pullRequestNo"
